<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --text: #e8eaf0;
      --muted: #7b82a0;
      --accent: #5b8dee;
      --green: #3ecf8e;
      --red: #f56565;
      --amber: #f6c90e;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #month-label {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr 320px;
      gap: 0;
      flex: 1;
      overflow: hidden;
      border-top: 1px solid var(--border);
    }

    .panel {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 24px;
    }

    .panel:last-child { border-right: none; }

    .panel-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* LEFT PANEL - Add Transaction */
    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
    }

    .field select option { background: var(--surface2); }

    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .type-btn {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .type-btn.active-income {
      background: rgba(62, 207, 142, 0.15);
      border-color: var(--green);
      color: var(--green);
    }

    .type-btn.active-expense {
      background: rgba(245, 101, 101, 0.15);
      border-color: var(--red);
      color: var(--red);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .submit-btn:hover { opacity: 0.85; }

    .summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 24px;
    }

    .stat-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .stat-card .stat-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat-card .stat-value {
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      font-weight: 500;
    }

    .stat-card.income .stat-value { color: var(--green); }
    .stat-card.expense .stat-value { color: var(--red); }
    .stat-card.balance { grid-column: span 2; }
    .stat-card.balance .stat-value { color: var(--accent); font-size: 22px; }

    /* MIDDLE PANEL - Chart */
    .chart-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 24px;
    }

    #pie-container {
    position: relative;
    width: min(80%, 420px);
    aspect-ratio: 1;
    }

    #pie-chart {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .pie-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .pie-center .pie-pct {
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      font-weight: 500;
      color: var(--text);
    }

    .pie-center .pie-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 280px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .legend-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-name { color: var(--text); }
    .legend-amount {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    /* RIGHT PANEL - Transactions */
    .tx-list { display: flex; flex-direction: column; gap: 8px; }

    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      gap: 10px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tx-left { flex: 1; min-width: 0; }

    .tx-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }

    .tx-category {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      text-transform: capitalize;
    }

    .tx-desc {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-date {
      font-size: 10px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .tx-amount {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .tx-amount.income { color: var(--green); }
    .tx-amount.expense { color: var(--red); }

    .tx-delete {
      background: none;
      border: none;
      color: var(--border);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .tx-delete:hover { color: var(--red); }

    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 40px 0;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<header>
  <h1>Budget Tracker</h1>
  <span id="month-label"></span>
</header>

<div class="layout">

  <!-- LEFT: Add Transaction -->
  <div class="panel">
    <div class="panel-title">Add Transaction</div>

    <div class="type-toggle">
      <div class="type-btn active-income" id="btn-income" onclick="setType('income')">+ Income</div>
      <div class="type-btn" id="btn-expense" onclick="setType('expense')">− Expense</div>
    </div>

    <div class="field">
      <label>Amount</label>
      <input type="number" id="amount" placeholder="0.00" step="0.01" min="0">
    </div>

    <div class="field">
      <label>Category</label>
      <select id="category">
        <option value="salary">Salary</option>
        <option value="freelance">Freelance</option>
        <option value="food">Food</option>
        <option value="rent">Rent</option>
        <option value="transport">Transport</option>
        <option value="utilities">Utilities</option>
        <option value="entertainment">Entertainment</option>
        <option value="health">Health</option>
        <option value="subscriptions">Subscriptions</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="field">
      <label>Description</label>
      <input type="text" id="description" placeholder="Optional note">
    </div>

    <button class="submit-btn" onclick="addTransaction()">Add Transaction</button>

    <div class="summary-row">
      <div class="stat-card income">
        <div class="stat-label">Income</div>
        <div class="stat-value" id="total-income">$0</div>
      </div>
      <div class="stat-card expense">
        <div class="stat-label">Expenses</div>
        <div class="stat-value" id="total-expenses">$0</div>
      </div>
      <div class="stat-card balance">
        <div class="stat-label">Balance</div>
        <div class="stat-value" id="total-balance">$0</div>
      </div>
    </div>
  </div>

  <!-- MIDDLE: Pie Chart -->
  <div class="panel" style="border-right: 1px solid var(--border);">
    <div class="panel-title" style="text-align:center;">Monthly Overview</div>
    <div class="chart-wrap">
      <div id="pie-container">
        <svg id="pie-chart" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" fill="none" stroke="var(--surface2)" stroke-width="20"/>
          <g id="pie-slices"></g>
        </svg>
        <div class="pie-center">
          <div class="pie-pct" id="pie-pct">0%</div>
          <div class="pie-sub">spent</div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <!-- RIGHT: Transaction List -->
  <div class="panel">
    <div class="panel-title">This Month</div>
    <div class="tx-list" id="tx-list">
      <div class="empty-state">No transactions yet</div>
    </div>
  </div>

</div>

<script>
  var selectedType = 'income';

  function setType(type) {
    selectedType = type;
    document.getElementById('btn-income').className = 'type-btn' + (type === 'income' ? ' active-income' : '');
    document.getElementById('btn-expense').className = 'type-btn' + (type === 'expense' ? ' active-expense' : '');

    var catSelect = document.getElementById('category');
    var incomeOpts = ['salary', 'freelance', 'other'];
    var expenseOpts = ['food', 'rent', 'transport', 'utilities', 'entertainment', 'health', 'subscriptions', 'other'];
    var opts = type === 'income' ? incomeOpts : expenseOpts;
    catSelect.innerHTML = opts.map(function(o) {
      return '<option value="' + o + '">' + o.charAt(0).toUpperCase() + o.slice(1) + '</option>';
    }).join('');
  }

  function getMonthLabel() {
    var now = new Date();
    return now.toLocaleString('default', { month: 'long', year: 'numeric' });
  }

  document.getElementById('month-label').textContent = getMonthLabel();

  var COLORS = {
    food: '#f56565',
    rent: '#ed8936',
    transport: '#ecc94b',
    utilities: '#48bb78',
    entertainment: '#38b2ac',
    health: '#4299e1',
    subscriptions: '#9f7aea',
    freelance: '#68d391',
    salary: '#3ecf8e',
    other: '#718096',
    remaining: '#2e3350'
  };

  function drawPie(income, expensesByCategory) {
    var totalExpenses = Object.values(expensesByCategory).reduce(function(a, b) { return a + b; }, 0);
    var remaining = Math.max(0, income - totalExpenses);
    var total = income > 0 ? income : (totalExpenses || 1);

    var pct = income > 0 ? Math.round((totalExpenses / income) * 100) : 0;
    document.getElementById('pie-pct').textContent = pct + '%';

    var slicesEl = document.getElementById('pie-slices');
    slicesEl.innerHTML = '';

    var legendEl = document.getElementById('legend');
    legendEl.innerHTML = '';

    var cx = 50, cy = 50, r = 40, strokeW = 20;
    var circumference = 2 * Math.PI * r;
    var offset = 0;

    var segments = Object.entries(expensesByCategory).map(function(e) {
      return { name: e[0], amount: e[1], color: COLORS[e[0]] || COLORS.other };
    });

    if (remaining > 0) {
      segments.push({ name: 'remaining', amount: remaining, color: COLORS.remaining });
    }

    segments.forEach(function(seg) {
      var fraction = seg.amount / total;
      var dash = fraction * circumference;
      var gap = circumference - dash;

      var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', cx);
      circle.setAttribute('cy', cy);
      circle.setAttribute('r', r);
      circle.setAttribute('fill', 'none');
      circle.setAttribute('stroke', seg.color);
      circle.setAttribute('stroke-width', strokeW);
      circle.setAttribute('stroke-dasharray', dash + ' ' + gap);
      circle.setAttribute('stroke-dashoffset', -offset * circumference);
      slicesEl.appendChild(circle);

      offset += fraction;

      if (seg.name !== 'remaining') {
        var item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML =
          '<div class="legend-left">' +
            '<div class="legend-dot" style="background:' + seg.color + '"></div>' +
            '<span class="legend-name">' + seg.name.charAt(0).toUpperCase() + seg.name.slice(1) + '</span>' +
          '</div>' +
          '<span class="legend-amount">$' + seg.amount.toFixed(2) + '</span>';
        legendEl.appendChild(item);
      }
    });
  }

  function loadData() {
    fetch('/api/summary')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        document.getElementById('total-income').textContent = '$' + data.income.toFixed(2);
        document.getElementById('total-expenses').textContent = '$' + data.expenses.toFixed(2);
        var bal = data.balance;
        document.getElementById('total-balance').textContent = (bal < 0 ? '-$' : '$') + Math.abs(bal).toFixed(2);
        document.getElementById('total-balance').style.color = bal < 0 ? 'var(--red)' : 'var(--accent)';
      });

    fetch('/api/transactions')
      .then(function(r) { return r.json(); })
      .then(function(transactions) {
        var now = new Date();
        var thisMonth = transactions.filter(function(t) {
          var d = new Date(t.date);
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        });

        var income = thisMonth.filter(function(t) { return t.type === 'income'; })
          .reduce(function(s, t) { return s + t.amount; }, 0);

        var expensesByCategory = {};
        thisMonth.filter(function(t) { return t.type === 'expense'; }).forEach(function(t) {
          expensesByCategory[t.category] = (expensesByCategory[t.category] || 0) + t.amount;
        });

        drawPie(income, expensesByCategory);

        var listEl = document.getElementById('tx-list');
        if (thisMonth.length === 0) {
          listEl.innerHTML = '<div class="empty-state">No transactions this month</div>';
          return;
        }

        listEl.innerHTML = thisMonth.map(function(t) {
          var d = new Date(t.date);
          var dateStr = (d.getMonth()+1) + '/' + d.getDate();
          return '<div class="tx-item">' +
            '<div class="tx-left">' +
              '<div class="tx-top">' +
                '<span class="tx-category">' + t.category + '</span>' +
              '</div>' +
              (t.description ? '<div class="tx-desc">' + t.description + '</div>' : '') +
              '<div class="tx-date">' + dateStr + '</div>' +
            '</div>' +
            '<span class="tx-amount ' + t.type + '">' + (t.type === 'income' ? '+' : '-') + '$' + t.amount.toFixed(2) + '</span>' +
            '<button class="tx-delete" onclick="deleteTransaction(' + t.id + ')" title="Delete">×</button>' +
          '</div>';
        }).join('');
      });
  }

  function addTransaction() {
    var amount = parseFloat(document.getElementById('amount').value);
    if (!amount || amount <= 0) { alert('Enter a valid amount'); return; }

    fetch('/api/transactions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: selectedType,
        amount: amount,
        category: document.getElementById('category').value,
        description: document.getElementById('description').value
      })
    }).then(function() {
      document.getElementById('amount').value = '';
      document.getElementById('description').value = '';
      loadData();
    });
  }

  function deleteTransaction(id) {
    fetch('/api/transactions/' + id, { method: 'DELETE' }).then(loadData);
  }

  loadData();
</script>
</body>
</html>
